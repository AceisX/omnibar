# omnibar.toml — configurazione, con i default e il perché di ognuno.
#
# Questa è la copia di riferimento. Quella vera vive in
# %APPDATA%\OmniBar\omnibar.toml, oppure accanto all'eseguibile se c'è
# `portable.flag`.
#
# Si può modificare a mano — ed è pensato per restare leggibile — ma dalla
# fase 6 ci sarà una finestra di configurazione, e chi non vuole aprire un file
# di testo non dovrà farlo.
#
# Un valore sbagliato NON spegne la barra: viene segnalato nel log con la riga e
# il motivo, e per quella impostazione vale il default. Il resto del file si
# applica lo stesso. Anche una chiave scritta male viene segnalata, invece di
# essere ignorata in silenzio.

[bar]
# Su quale bordo vive: right | left | bottom | top.
# Sui bordi laterali lo spazio è poco: le etichette spariscono e restano le
# icone, che a quella dimensione dicono la stessa cosa.
edge = "right"

# Lunghezza sul bordo lungo. "auto" — il default — la fa lunga quanto il suo
# contenuto e non un dito di più: una barra che occupa il 60 % dello schermo
# per mostrare otto icone non è minimal, è solo grande.
# In alternativa una percentuale dell'area di lavoro, es. extent = 60.
extent     = "auto"
max_extent = 85          # il tetto dell'auto: oltre, si va in overflow

# Spessore in DIP: larghezza sui bordi laterali, altezza su quelli orizzontali.
# Scala col DPI. Con 44 un bottone da 30 sta dentro con sette punti di margine.
thickness = 44

# Raggio degli angoli, sul lato rivolto verso lo schermo.
corner_radius = 20

# Quanto è velato il FONDO della barra — non tutta la finestra. La differenza
# conta: velando l'intera finestra diventerebbero trasparenti anche le icone,
# che perderebbero contrasto proprio dove serve.
opacity = 0.85

# auto | dark | light. `auto` segue il tema delle applicazioni di Windows e
# cambia a caldo.
theme = "auto"


[reveal]
# La linea sempre visibile sul bordo, e la sporgenza al suo centro. Fra le due
# c'è una spalla raccordata: è una figura sola, non una linea con un blocco
# appoggiato sopra.
line          = 2
nub_thickness = 7
nub_length    = 78

# La zona sensibile sul bordo, in pixel fisici. Sotto i 2 px diventa difficile
# da colpire su schermi ad alto DPI; sopra i 6 si attiva quando non vuoi.
trigger_px = 6

# Le due soglie che evitano i falsi positivi: il cursore deve restare nella zona
# per `delay_ms` E aver percorso meno di `travel_px` in quel tempo. Un cursore
# lanciato che rimbalza sul bordo ha velocità alta e viene scartato.
delay_ms  = 90
travel_px = 40

# Quanto aspetta prima di COMINCIARE a chiudersi quando esci — non quanto ci
# mette a chiudersi. Serve a non far sparire la barra se il cursore ne esce per
# un attimo mentre punta un bottone sul bordo.
unhover_ms = 200

# false disattiva del tutto l'apertura al passaggio del mouse: resta solo
# l'hotkey. Su un portatile col trackpad c'è chi la preferisce così.
on_hover = true


[colors]
# Il colore d'accento — toggle accesi, anello di richiamo, l'agente — arriva
# dalla personalizzazione di Windows: è quello che hai scelto tu nelle
# impostazioni, non una tavolozza inventata da noi. Cambia a caldo quando lo
# cambi.
#
# "system" segue Windows. In alternativa un colore esplicito, es. "#D1734A".
accent = "system"

# Quanto si smorza quel colore prima di usarlo, da 0 a 1. Il colore scelto
# dall'utente è pensato per campiture grandi — la barra del titolo, il menu
# Start — e su superfici piccole come un toggle o una faccia da trenta punti
# arriva più forte del dovuto. Si toglie croma, non luminosità: i blu restano
# blu.
soften = 0.20


[log]
# trace | debug | info | warn | error
level = "info"


# ─────────────────────────────────────────────────────────────────────────────
# I widget della barra
# ─────────────────────────────────────────────────────────────────────────────
#
# Compaiono nell'ordine in cui sono scritti. Se non ne dichiari nessuno, la
# barra usa il proprio contenuto di partenza — una barra vuota al primo avvio
# non spiegherebbe a nessuno a cosa serve.
#
# Tipi: button, toggle, label, separator, spacer, avatar.
# Le icone si indicano per nome (folder, camera, copy, search, play, settings…),
# non per codice: "sigma" resta "sigma" anche se un giorno l'icona cambia.
#
# Ogni widget che si può premere vuole un « tooltip » (o « label », o « a11y »):
# senza, chi usa uno screen reader sente soltanto "pulsante".

# [[widget]]
# type    = "button"
# id      = "note"
# icon    = "document"
# tooltip = "Blocco note"
# action  = { kind = "shell", exe = "notepad.exe" }

# [[widget]]
# type    = "button"
# icon    = "search"
# tooltip = "Cerca"
# action  = { kind = "keystroke", keys = "Win+S" }

# [[widget]]
# type = "separator"

# [[widget]]
# type    = "toggle"
# icon    = "pin"
# tooltip = "Tieni aperta"
# action  = { kind = "internal", name = "bar.pin" }

# [[widget]]
# type = "avatar"

# Le azioni possibili:
#
#   { kind = "keystroke", keys = "Ctrl+Shift+S" }
#   { kind = "shell", exe = "ffmpeg.exe", args = ["-i", "in.mp4", "out.webm"] }
#   { kind = "url", url = "https://esempio.it" }
#   { kind = "internal", name = "bar.pin" }
#   { kind = "macro", steps = [ { kind = "keystroke", keys = "Alt+W" }, … ] }
#
# Gli argomenti di « shell » sono un elenco, un argomento per elemento, mai una
# riga di comando in una stringa sola. Non è una convenzione: è il motivo per
# cui in un file di configurazione non si può scrivere una command injection.

# ─────────────────────────────────────────────────────────────────────────────
# Da qui in giù: non ancora implementato. Le sezioni sconosciute vengono
# ignorate senza avvisi, così questo file può descrivere anche dove si sta
# andando senza riempire il log a ogni avvio.
# ─────────────────────────────────────────────────────────────────────────────

# [hotkeys]
# La barra è navigabile interamente con frecce e Invio: al bordo dello schermo
# col trackpad si arriva male, e questa non è una scorciatoia per esperti ma la
# via principale su laptop.
# toggle = "Win+Space"
# pin    = "Win+Shift+Space"

# [zones]
# Cosa sta sempre nella barra e cosa cambia col programma in primo piano. La
# distinzione è del progetto, ma quali widget stiano di qua o di là lo decide
# l'utente: un widget non è fisso o contestuale per natura, lo è per scelta.
# pinned = ["media", "volume", "agent"]

# [[profile]]
# Un profilo per applicazione: i widget che compaiono quando quel programma è in
# primo piano. Il tier dichiarativo non richiede di scrivere codice.
# match = { process = "EXCEL.EXE" }
